[workspace]
resolver = "2"
members = [
    "crates/stone-core",
    "crates/stone-cli",
    "crates/stone-server",
    "crates/stone-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
serde_yaml = "0.9"
rusqlite = { version = "0.32", features = ["bundled"] }
pulldown-cmark = "0.12"
notify = "8"
blake3 = "1"
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.9"
rand_chacha = "0.9"
unicode-normalization = "0.1"
unicode-segmentation = "1"
similar = "2"
fastcdc = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util", "fs", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "json", "stream", "blocking"] }
tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4", features = ["derive", "cargo"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
regex = "1.11"
once_cell = "1.20"
base64 = "0.22"
zeroize = "1"
fd-lock = "4"
directories = "6"
globset = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
